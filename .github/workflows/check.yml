name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      # Formatting is settled by `nix fmt` for every language in the tree, so
      # one step covers the Nix, the Rust and the Python.
      - name: nix fmt
        run: |
          nix fmt
          git diff --exit-code

      # Pushes what this run builds, so the next one and the pages deploy do
      # not rebuild the site data from the databases again.
      - uses: cachix/cachix-action@v17
        with:
          name: omnibin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # House style is a flake check now, so `nix flake check` covers it along
      # with everything else. Running it here as well would only mean it gets
      # checked in a shell and in the sandbox, and the sandbox is the one that
      # keeps running when this file changes shape.
      - name: nix flake check
        run: nix flake check --all-systems

      - name: build
        run: nix build .#omnibin .#omnibin-shell

      # The filesystem is only interesting mounted. The runner has /dev/fuse,
      # so this mounts a tree built from a small crawl and checks that looking
      # at a package costs no download and reading one does.
      - name: mount test
        run: nix develop --command tests/mount-test.sh
