[package]
name = "omnibin"
version = "0.1.0"
edition = "2021"
description = "Every binary nixpkgs ever shipped, on your PATH"
license = "MIT"

[dependencies]
# `bundled` compiles SQLite from the vendored amalgamation. The database is a
# build product of this repository, so the SQLite that reads it is pinned to
# the binary rather than to whatever the host happens to have.
rusqlite = { version = "0.37", features = ["bundled"] }
fuser = "0.15"
ureq = "2"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = [ "derive", "env" ] }
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
